name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow token (SEC-E3): the jobs only read the repository; nothing writes back to GitHub.
# Actions are pinned to the commit SHAs GitHub resolved their tags to (CI run 71 log, 2026-09-30); the tag stays as a comment. Update both together.
permissions:
  contents: read

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9   # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ReleaseMgmt.Web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: '3.12'
      - name: Build web
        working-directory: src/ReleaseMgmt.Web
        run: |
          npm ci
          npm run build
      - name: Build
        run: dotnet build ReleaseMgmt.sln --configuration Release
      - name: Test
        run: dotnet test ReleaseMgmt.sln --configuration Release --no-build
      - name: Schema reference suite (88 cases)
        run: python tests/reference/test_schema.py
      - name: Tooling tests (start.py reset git logic)
        run: python tests/tools/test_start.py
      - name: Install e2e dependencies
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install chromium
      - name: E2E (Playwright drives the real app, started through start.py)
        working-directory: tests/e2e
        env:
          Pdf__QuestPdfLicense: Evaluation   # test runs only: accepted in Development, refused in production (OI-2, the real licence tier is the owner's decision)
        run: npx playwright test
      - name: Keep the Playwright report when E2E fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: playwright-${{ matrix.os }}
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            logs
          if-no-files-found: ignore
