name: Schema oracle on Postgres

# REOS-195: runs the schema oracle (tests/reference/test_schema.py) against Postgres to measure how far a Postgres port is from the contract.
# NON-GATING for now: it runs on pushes to main and nightly only (never on pull requests), and a failing CASE is the porting backlog, not an error.
# The job fails only when the run cannot be done at all: no server, or db/schema.sql cannot be turned into a Postgres schema.
# The Postgres schema is generated from db/schema.sql by tools/gen_pg_schema.py on every run, so the job does not drift while the schema grows.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'   # nightly, UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-oracle-postgres:
    name: schema-oracle-postgres
    runs-on: ubuntu-latest
    continue-on-error: true   # non-gating (REOS-195); remove when the port plan (REOS-194) is approved and the cases are expected green
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reos_oracle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REOS_PG_DSN: postgresql://postgres:postgres@localhost:5432/reos_oracle
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: '3.12'
      - name: Install the Postgres driver
        run: python -m pip install -r tests/reference/requirements-postgres.txt
      - name: "The Postgres schema can be generated from db/schema.sql (fails only when it cannot be produced, not when the schema grows)"
        run: python tools/gen_pg_schema.py --check
      - name: Oracle on Postgres, with report
        run: python tests/reference/test_schema.py --dialect postgres --report
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: postgres-oracle-report
          path: docs/proposals/postgres-oracle-report.md
          if-no-files-found: ignore
