name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow token (SEC-E3): the jobs only read the repository; nothing writes back to GitHub.
permissions:
  contents: read

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ReleaseMgmt.Web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build web
        working-directory: src/ReleaseMgmt.Web
        run: |
          npm ci
          npm run build
      - name: Build
        run: dotnet build ReleaseMgmt.sln --configuration Release
      - name: Test
        run: dotnet test ReleaseMgmt.sln --configuration Release --no-build
      - name: Schema reference suite (82 cases)
        run: python tests/reference/test_schema.py
      - name: Tooling tests (start.py reset git logic)
        run: python tests/tools/test_start.py
      - name: Install e2e dependencies
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install chromium
      - name: E2E (Playwright drives the real app, started through start.py)
        working-directory: tests/e2e
        env:
          Pdf__QuestPdfLicense: Evaluation   # test runs only: accepted in Development, refused in production (OI-2, the real licence tier is the owner's decision)
        run: npx playwright test
      - name: Keep the Playwright report when E2E fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            logs
          if-no-files-found: ignore
