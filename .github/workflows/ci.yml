name: CI

on:
  push:
    branches: [main, Team]
  pull_request:

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ReleaseMgmt.Web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build web
        working-directory: src/ReleaseMgmt.Web
        run: |
          npm ci
          npm run build
      - name: Build
        run: dotnet build ReleaseMgmt.sln --configuration Release
      - name: Test
        run: dotnet test ReleaseMgmt.sln --configuration Release --no-build
      - name: Schema reference suite (82 cases)
        run: python tests/reference/test_schema.py
