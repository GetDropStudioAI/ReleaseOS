name: Cross-browser

# REOS-149: the Playwright suite on Edge, Firefox and WebKit. NOT part of the per-PR gate (ci.yml, chromium only).
# Runs on pushes to main, nightly, and on demand. Each browser is its own job with its own app and database
# (one worker per job: the specs share one demo database and change the same trains).
on:
  push:
    branches: [main, reos-xb-webkit-edge]   # TEMPORARY (REOS-151/152 evidence run): removed again before the PR leaves draft
  schedule:
    - cron: '17 2 * * *'   # nightly, 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-browser:
    name: cross-browser (${{ matrix.browser }} on ${{ matrix.os }})
    strategy:
      fail-fast: false   # a failing engine must not hide the others
      matrix:
        include:
          - { browser: msedge,  os: windows-latest }   # Edge is preinstalled on the Windows runner
          - { browser: webkit,  os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75   # the suite takes about 30 minutes per browser, plus about 10 for build and start; 75 leaves headroom and stops a hang
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9   # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ReleaseMgmt.Web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: '3.12'
      - name: Build web
        working-directory: src/ReleaseMgmt.Web
        run: |
          npm ci
          npm run build
      - name: Build
        run: dotnet build ReleaseMgmt.sln --configuration Release
      - name: Install e2e dependencies
        working-directory: tests/e2e
        shell: bash
        run: |
          npm ci
          if [ "${{ matrix.browser }}" != "msedge" ]; then npx playwright install --with-deps ${{ matrix.browser }}; fi
      - name: "E2E on ${{ matrix.browser }} (Playwright drives the real app, started through start.py)"
        working-directory: tests/e2e
        env:
          E2E_CROSS_BROWSER: '1'
          Pdf__QuestPdfLicense: Evaluation   # test runs only, as in ci.yml (OI-2)
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Keep the Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            logs
          if-no-files-found: ignore
